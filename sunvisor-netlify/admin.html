<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Відгуки — адмінка</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0E1116; color: #E8EBF0; font: 16px/1.5 -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  .box { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #8A93A1; margin: 0 0 20px; }
  .card { background: #171B22; border: 1px solid #232934; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  input[type=password], input[type=file] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #232934; background: #0E1116; color: #fff; font-size: 16px; }
  button { cursor: pointer; border: 0; border-radius: 12px; font-weight: 700; font-size: 16px; }
  button:disabled { opacity: .6; cursor: default; }
  .btn { width: 100%; margin-top: 12px; padding: 15px; color: #140E00; background: linear-gradient(135deg, #FFB020, #FF7A00); }
  .link { background: none; color: #8A93A1; padding: 0; font-weight: 500; text-decoration: underline; }
  .msg { padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; }
  .ok { background: rgba(79,194,138,.15); color: #7BE0AE; }
  .err { background: rgba(255,90,90,.15); color: #FF9A9A; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .shot { background: #0E1116; border: 1px solid #232934; border-radius: 12px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: 220px; object-fit: cover; object-position: top; }
  .del { width: 100%; padding: 10px; background: #232934; color: #FF9A9A; border-radius: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .empty { color: #8A93A1; text-align: center; padding: 20px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box">

  <div id="loginView">
    <h1>Вхід в адмінку відгуків</h1>
    <p class="sub">Тут можна додавати і видаляти скриншоти відгуків на сайті.</p>
    <div class="msg err" id="loginErr" hidden></div>
    <form class="card" id="loginForm">
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
      <button class="btn" id="loginBtn">Увійти</button>
    </form>
  </div>

  <div id="adminView" hidden>
    <div class="top">
      <div>
        <h1>Відгуки</h1>
        <p class="sub" style="margin:0">На сайті: <span id="count">0</span></p>
      </div>
      <button class="link" id="logout">Вийти</button>
    </div>
    <div class="msg ok" id="okMsg" hidden></div>
    <div class="msg err" id="errMsg" hidden></div>
    <form class="card" id="uploadForm">
      <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple required>
      <button class="btn" id="uploadBtn">Додати скриншоти</button>
      <p class="sub" style="margin:10px 0 0;font-size:14px">JPG, PNG або WEBP. Можна обрати кілька одразу. Нові показуються першими.</p>
    </form>
    <div class="empty" id="empty" hidden>Скриншотів ще немає — поки їх немає, блок відгуків на сайті прихований.</div>
    <div class="grid" id="grid"></div>
  </div>

</div>
<script>
  var pass = '';
  try { pass = sessionStorage.getItem('reviewsPass') || ''; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };

  function show(el, text) { el.textContent = text; el.hidden = !text; }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'x-admin-password': pass }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || ('Помилка ' + r.status));
        return data;
      });
    });
  }

  // Стискаємо скриншот перед завантаженням: до 1200 px по ширині, JPEG
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1200 / img.naturalWidth);
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Не вдалося обробити ' + file.name)); }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { reject(new Error('Файл «' + file.name + '» не є картинкою')); };
      img.src = URL.createObjectURL(file);
    });
  }

  function load() {
    return api('/api/reviews').then(function (data) {
      var grid = $('grid');
      grid.innerHTML = '';
      $('count').textContent = data.reviews.length;
      $('empty').hidden = data.reviews.length > 0;
      data.reviews.forEach(function (r) {
        var d = document.createElement('div');
        d.className = 'shot';
        var a = document.createElement('a');
        a.href = r.url; a.target = '_blank';
        var img = document.createElement('img');
        img.src = r.url; img.alt = '';
        a.appendChild(img);
        var b = document.createElement('button');
        b.className = 'del'; b.textContent = 'Видалити';
        b.onclick = function () {
          if (!confirm('Видалити цей скриншот?')) return;
          b.disabled = true;
          api(r.url, { method: 'DELETE' })
            .then(function () { show($('okMsg'), 'Скриншот видалено.'); show($('errMsg'), ''); return load(); })
            .catch(function (e) { b.disabled = false; show($('errMsg'), e.message); });
        };
        d.appendChild(a); d.appendChild(b);
        grid.appendChild(d);
      });
    });
  }

  function enter() {
    $('loginView').hidden = true;
    $('adminView').hidden = false;
    load().catch(function (e) { show($('errMsg'), e.message); });
  }

  $('loginForm').onsubmit = function (e) {
    e.preventDefault();
    pass = $('password').value;
    $('loginBtn').disabled = true;
    api('/api/reviews?check=1')
      .then(function () {
        try { sessionStorage.setItem('reviewsPass', pass); } catch (e) {}
        enter();
      })
      .catch(function (e) { show($('loginErr'), e.message); })
      .then(function () { $('loginBtn').disabled = false; });
  };

  $('logout').onclick = function () {
    try { sessionStorage.removeItem('reviewsPass'); } catch (e) {}
    location.reload();
  };

  $('uploadForm').onsubmit = function (e) {
    e.preventDefault();
    var files = Array.prototype.slice.call($('files').files);
    if (!files.length) return;
    var btn = $('uploadBtn');
    btn.disabled = true;
    show($('okMsg'), ''); show($('errMsg'), '');
    var added = 0, errors = [];
    files.reduce(function (p, file, i) {
      return p.then(function () {
        btn.textContent = 'Завантаження ' + (i + 1) + ' з ' + files.length + '…';
        return shrink(file)
          .then(function (blob) { return api('/api/reviews', { method: 'POST', body: blob, headers: { 'content-type': 'image/jpeg' } }); })
          .then(function () { added++; })
          .catch(function (e) { errors.push(e.message); });
      });
    }, Promise.resolve()).then(function () {
      btn.disabled = false;
      btn.textContent = 'Додати скриншоти';
      $('uploadForm').reset();
      if (added) show($('okMsg'), 'Додано скриншотів: ' + added + '.');
      if (errors.length) show($('errMsg'), errors.join(' '));
      return load();
    });
  };

  if (pass) {
    api('/api/reviews?check=1').then(enter).catch(function () { pass = ''; });
  }
</script>
</body>
</html>
